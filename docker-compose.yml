services:
  fnos-nfo-bridge:
    image: ghcr.io/xiaotian89/fnos-nfo-bridge:latest
    container_name: fnos-nfo-bridge
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 媒体库目录（容器内路径），多个用冒号分隔
      MEDIA_DIRS: /media
      # 飞牛影视数据库与图片目录
      TRIM_DB: /trim/db/trimmedia.db
      TRIM_IMG_DIR: /trim/img
      # 自定义执行时间：标准 5 段 cron，默认每天 02:05
      CRON: "5 2 * * *"
      # 启动时先跑一次
      RUN_ON_START: "true"
      # 下载演员头像用的代理（不需要就删掉）
      PROXY: ""
      # 是否用 NFO 覆盖数据库已有内容
      OVERWRITE: "true"
      # 首次写入前备份数据库
      BACKUP_DB: "true"
    volumes:
      # 媒体库（只读）
      - /vol6/1000/media/download/STRM:/media:ro
      # 飞牛影视数据库目录（需要可写）
      - /usr/local/apps/@appdata/trim.media/database:/trim/db
      # 飞牛影视图片目录（需要可写）
      - /usr/local/apps/@appdata/trim.media/img:/trim/img
